name: Verify submission

on:
  push:
    branches:
      - clinical-trial-ner
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run unit and regression tests
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python -m pytest

      - name: Validate committed exam evidence
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python scripts/verify_submission.py
